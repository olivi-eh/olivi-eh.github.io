{% from "_macros.html" import post_info -%}
<div id="blog-list">
  <div class="resume-cards-group">
  {% for post in posts %}
  {% if post.published %}
    <a href="{{ post.url_absolute }}">
        <div class="resume-card">
          <div class="resume-card-header">
            <div>
              <b style="font-size: 1.2em">{{ post.title_raw }}</b><br />

              {{ post_info(post) }}
            </div>
          </div>
        </div>
      </a>
    {% endif %}
    {% endfor %}
    {% if not hide_see_all %}
    <div class="resume-card">
      <div class="resume-card-header">
        <b><i class="fa-regular fa-angle-right me-1"></i><a href="/blog/">See all posts</a></b>
      </div>
    </div>
    {% endif %}
  </div>
</div>
